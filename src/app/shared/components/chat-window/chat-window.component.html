<div class="chat-integration" [class.is-empty]="isFirstMessage()">

    @if (isFirstMessage()) {
      <div class="empty-state-content animate-fade-in">
          <h1>Ask anything.</h1>
          <p>Ready to extract insights from your file.</p>
      </div>
    }
  
    <div class="messages-flow" [class.hidden]="isFirstMessage()"></div>
  
    <footer class="chat-input-area">
      <div class="input-wrapper">
        <textarea 
          placeholder="Type your question about the document..." 
          rows="1" 
          #chatInput
          (keydown.enter)="$event.preventDefault(); sendMessage(chatInput.value); chatInput.value = ''">
        </textarea>
        <button class="send-btn" title="Send message" (click)="sendMessage(chatInput.value); chatInput.value = ''">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <p class="footer-note">Powered by LlamaIndex, Groq & Pinecone.</p>
    </footer>
  
  </div>
