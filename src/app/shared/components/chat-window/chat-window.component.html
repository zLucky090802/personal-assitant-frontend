<div class="chat-integration" [class.is-empty]="isFirstMessage()">

  @if (isFirstMessage()) {
    <div class="empty-state-content animate-fade-in">
        <h1>Ask anything.</h1>
        <p>Ready to extract insights from your file.</p>
    </div>
  }

  <div class="messages-flow" [class.hidden]="isFirstMessage()">
    @for (msg of messages; track $index) {
      <div class="message-row" [class.user-row]="msg.rol === 'user'">
        
        @if (msg.rol === 'assistant') {
          <div class="ai-avatar">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 0 1 10 10c0 5.523-4.477 10-10 10S2 17.523 2 12A10 10 0 0 1 12 2z"/><path d="M12 6v12"/><path d="M6 12h12"/></svg>
          </div>
        }

        <div class="message-bubble" [class.user-bubble]="msg.rol === 'user'">
          <p>{{ msg.response }}</p>
        </div>

      </div>
    }
  </div>

  <footer class="chat-input-area">
    <div class="input-wrapper">
      <textarea 
        placeholder="Type your question about the document..." 
        rows="1" 
        #chatInput
        (keydown.enter)="$event.preventDefault(); sendMessage(chatInput.value); chatInput.value = ''">
      </textarea>
      <button class="send-btn" title="Send message" (click)="sendMessage(chatInput.value); chatInput.value = ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
    <p class="footer-note">Powered by LlamaIndex, Groq & Pinecone.</p>
  </footer>

</div>
